<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clapham Junction &middot; Live Departures</title>
  <script type="module" src="https://cdn.jsdelivr.net/gh/starfederation/datastar@v1.0.3/bundles/datastar.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

    :root {
      --board-bg: #0a0e0a;
      --board-amber: #ffb000;
      --board-amber-dim: #8a5f00;
      --board-line: #2a2f2a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      background: #000;
      color: var(--board-amber);
      font-family: 'Share Tech Mono', monospace;
    }

    .board {
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      background: var(--board-bg);
      box-shadow: inset 0 0 12vw rgba(0, 0, 0, 0.6);
    }

    .board-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 3vh 4vw 2vh;
      border-bottom: 0.3vh solid var(--board-line);
    }

    .board-header h1 {
      margin: 0;
      font-size: clamp(2rem, 4.2vw, 4.5rem);
      letter-spacing: 0.3vw;
      text-transform: uppercase;
    }

    .board-header .clock {
      color: var(--board-amber-dim);
      font-size: clamp(1rem, 1.6vw, 2rem);
      letter-spacing: 0.2vw;
    }

    .live-dot {
      display: inline-block;
      width: 1.4vw;
      height: 1.4vw;
      max-width: 20px;
      max-height: 20px;
      border-radius: 50%;
      background: #2ecc40;
      margin-right: 1vw;
      box-shadow: 0 0 12px #2ecc40;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .table-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      font-size: clamp(1.4rem, 2.6vw, 3rem);
    }

    thead th {
      text-align: left;
      padding: 1.5vh 1.2vw;
      font-size: clamp(0.9rem, 1.3vw, 1.5rem);
      letter-spacing: 0.2vw;
      color: var(--board-amber-dim);
      border-bottom: 0.2vh solid var(--board-line);
    }

    thead th:first-child, tbody td:first-child { padding-left: 4vw; }
    thead th:last-child, tbody td:last-child { padding-right: 4vw; }

    tbody td {
      padding: 2.2vh 1.2vw;
      border-bottom: 0.2vh solid var(--board-line);
      letter-spacing: 0.05vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .c-time { width: 13%; }
    .c-dest { width: 42%; }
    .c-plat { width: 10%; text-align: center; }
    .c-status { width: 35%; text-align: right; }

    .status {
      display: inline-block;
      padding: 0.4vh 1vw;
      border-radius: 4px;
      font-size: 0.8em;
    }

    .status-ontime { color: #7CFC00; }
    .status-boarding { color: #ffb000; animation: pulse 1s infinite; }
    .status-delayed { color: #ff4136; }
    .status-departed { color: #555; text-decoration: line-through; }

    .ticker {
      border-top: 0.3vh solid var(--board-line);
      background: #050705;
      padding: 2vh 4vw;
      overflow: hidden;
      white-space: nowrap;
    }

    .ticker-text {
      display: inline-block;
      font-size: clamp(1.1rem, 1.8vw, 2.2rem);
      color: var(--board-amber);
    }

    .ticker-text::before {
      content: "\25B6 ";
      color: var(--board-amber-dim);
    }
  </style>
</head>
<body data-init="@get('/trains/events', {openWhenHidden: true})"
      data-on-interval__duration.2s.leading="@get('/trains/tick')">

  <div class="board">
    <div class="board-header">
      <h1><span class="live-dot"></span>Clapham Junction</h1>
      <span class="clock">LIVE DEPARTURES</span>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="c-time">Time</th>
            <th class="c-dest">Destination</th>
            <th class="c-plat">Plat</th>
            <th class="c-status">Status</th>
          </tr>
        </thead>
        <tbody id="departures-body">
          <tr>
            <td class="c-time">--:--</td>
            <td class="c-dest">Waiting for WireMock&hellip;</td>
            <td class="c-plat">-</td>
            <td class="c-status"><span class="status">CONNECTING</span></td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="ticker">
      <div id="ticker">
        <span class="ticker-text">Connecting to the departures feed&hellip;</span>
      </div>
    </div>
  </div>

</body>
</html>
