<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy 3 Year Anniversary</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@800&display=swap">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #03040a; }
    canvas { display: block; }
    #banner {
      position: fixed; left: 0; right: 0; bottom: 14vh;
      text-align: center; font-family: 'Poppins', sans-serif; color: #fff;
      opacity: 0; transform: scale(0.85); pointer-events: none;
      transition: opacity 2s ease-out, transform 2.5s cubic-bezier(.2, .8, .2, 1);
    }
    #banner.show { opacity: 1; transform: scale(1); }
    #banner h1 {
      margin: 0; font-weight: 800; font-size: clamp(2.5rem, 7vw, 8rem); letter-spacing: 0.02em;
      background: linear-gradient(90deg, #ffd166, #ff6b9d, #c77dff, #4cc9f0);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 18px rgba(255, 140, 220, 0.55));
    }
  </style>
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div id="banner"><h1></h1></div>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    // ---------- scene ----------
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 1, 1000);
    camera.position.set(0, 0, 120);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.0, 0.5, 0.05);
    composer.addPass(bloom);
    composer.addPass(new OutputPass());

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      composer.setSize(innerWidth, innerHeight);
    });

    // soft round sprite for every particle
    const sprite = (() => {
      const c = document.createElement('canvas'); c.width = c.height = 64;
      const g = c.getContext('2d'), grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(0.3, 'rgba(255,255,255,0.6)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);
    })();

    // a sky full of faint stars
    {
      const n = 900, p = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) {
        p[i * 3] = (Math.random() - 0.5) * 600;
        p[i * 3 + 1] = (Math.random() - 0.3) * 300;
        p[i * 3 + 2] = -200 - Math.random() * 100;
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(p, 3));
      scene.add(new THREE.Points(g, new THREE.PointsMaterial({
        size: 1.2, map: sprite, color: 0x6670a0, transparent: true, depthWrite: false })));
    }

    // ---------- particles ----------
    // One big ring buffer. Additive blending, so fading the colour to black fades the particle out.
    const MAX = 60000;
    const pos = new Float32Array(MAX * 3), col = new Float32Array(MAX * 3);
    const vel = new Float32Array(MAX * 3), base = new Float32Array(MAX * 3);
    const life = new Float32Array(MAX), maxLife = new Float32Array(MAX);
    const drag = new Float32Array(MAX), grav = new Float32Array(MAX);
    const hold = new Float32Array(MAX), flicker = new Uint8Array(MAX);
    let next = 0;

    const geom = new THREE.BufferGeometry();
    const posAttr = new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage);
    const colAttr = new THREE.BufferAttribute(col, 3).setUsage(THREE.DynamicDrawUsage);
    geom.setAttribute('position', posAttr);
    geom.setAttribute('color', colAttr);
    const points = new THREE.Points(geom, new THREE.PointsMaterial({
      size: 1.6, map: sprite, vertexColors: true, transparent: true,
      blending: THREE.AdditiveBlending, depthWrite: false }));
    points.frustumCulled = false;
    scene.add(points);

    function spawn(x, y, z, vx, vy, vz, c, l, d, g, h = 0, f = 0) {
      const i = next; next = (next + 1) % MAX;
      pos.set([x, y, z], i * 3); vel.set([vx, vy, vz], i * 3); base.set([c.r, c.g, c.b], i * 3);
      life[i] = maxLife[i] = l; drag[i] = d; grav[i] = g; hold[i] = h; flicker[i] = f;
    }

    function update(dt) {
      for (let i = 0; i < MAX; i++) {
        if (life[i] <= 0) continue;
        const k = i * 3;
        life[i] -= dt;
        if (life[i] <= 0) { col[k] = col[k + 1] = col[k + 2] = 0; continue; }
        const d = Math.exp(-drag[i] * dt);
        vel[k] *= d; vel[k + 1] *= d; vel[k + 2] *= d;
        if (hold[i] > 0) hold[i] -= dt; else vel[k + 1] -= grav[i] * dt;
        pos[k] += vel[k] * dt; pos[k + 1] += vel[k + 1] * dt; pos[k + 2] += vel[k + 2] * dt;
        const t = life[i] / maxLife[i];
        let a = t < 0.35 ? t / 0.35 : 1;
        if (flicker[i] && t < 0.6) a *= Math.random() < 0.5 ? 1.6 : 0.1;
        col[k] = base[k] * a; col[k + 1] = base[k + 1] * a; col[k + 2] = base[k + 2] * a;
      }
      posAttr.needsUpdate = colAttr.needsUpdate = true;
    }

    // ---------- shells ----------
    const color = (hue, s = 1, l = 0.6) => new THREE.Color().setHSL(((hue % 360) + 360) % 360 / 360, s, l);
    const randDir = () => {
      const u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2, r = Math.sqrt(1 - u * u);
      return [r * Math.cos(th), u, r * Math.sin(th)];
    };

    await document.fonts.load('800 200px Poppins');
    // sample the pixels of a big bold "3" once, as burst targets centred on 0,0
    const THREE_SHAPE = (() => {
      const c = document.createElement('canvas'); c.width = c.height = 220;
      const g = c.getContext('2d');
      g.fillStyle = '#fff'; g.font = '800 200px Poppins, Arial Black, sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('3', 110, 118);
      const data = g.getImageData(0, 0, 220, 220).data, pts = [];
      for (let y = 0; y < 220; y += 4) for (let x = 0; x < 220; x += 4)
        if (data[(y * 220 + x) * 4 + 3] > 128) pts.push([(x - 110) * 0.5, (110 - y) * 0.5]);
      return pts;
    })();

    const bursts = {
      peony(x, y, z, hue) {
        for (let i = 0; i < 260; i++) {
          const [dx, dy, dz] = randDir(), s = 32 + Math.random() * 8;
          spawn(x, y, z, dx * s, dy * s, dz * s, color(hue + Math.random() * 30), 1.6 + Math.random() * 0.6, 1.3, 9);
        }
      },
      willow(x, y, z) {
        for (let i = 0; i < 200; i++) {
          const [dx, dy, dz] = randDir(), s = 24 + Math.random() * 6;
          spawn(x, y, z, dx * s, dy * s, dz * s, color(38 + Math.random() * 10, 1, 0.55), 3 + Math.random(), 2.2, 7);
        }
      },
      ring(x, y, z, hue) {
        const tilt = new THREE.Euler(Math.random() * 1.2 - 0.6, Math.random() * Math.PI, 0);
        const v = new THREE.Vector3();
        for (let i = 0; i < 90; i++) {
          const a = (i / 90) * Math.PI * 2;
          v.set(Math.cos(a), Math.sin(a), 0).applyEuler(tilt).multiplyScalar(34 + Math.random() * 3);
          spawn(x, y, z, v.x, v.y, v.z, color(hue), 1.8 + Math.random() * 0.3, 1.2, 8);
        }
      },
      crackle(x, y, z, hue) {
        for (let i = 0; i < 220; i++) {
          const [dx, dy, dz] = randDir(), s = 22 + Math.random() * 10;
          spawn(x, y, z, dx * s, dy * s, dz * s, color(hue, 0.3, 0.8), 1.8 + Math.random() * 0.8, 1.6, 8, 0, 1);
        }
      },
      three(x, y, z, hue) {
        // v0 = target * drag means each spark glides out and settles exactly on its target
        const d = 3.2;
        for (const [tx, ty] of THREE_SHAPE) {
          const jx = tx + (Math.random() - 0.5), jy = ty + (Math.random() - 0.5), jz = (Math.random() - 0.5) * 2;
          spawn(x, y, z, jx * d, jy * d, jz * d, color(hue + Math.random() * 15, 1, 0.45), 5 + Math.random(), d, 6, 3.2);
        }
        bursts.peony(x, y, z, hue + 200); // flash around it as it opens
      },
    };

    // ---------- rockets ----------
    const rockets = [];
    const viewSize = () => {
      const h = 2 * camera.position.z * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
      return [h * camera.aspect, h];
    };

    function launch(s) {
      const [w, h] = viewSize();
      const x = (s.x / 100 - 0.5) * w * 0.85;
      rockets.push({
        type: s.type in bursts ? s.type : 'peony', hue: s.hue,
        x0: x + (Math.random() - 0.5) * 10, x1: x,
        y0: -h / 2 - 5, y1: (s.y / 100 - 0.5) * h,
        z: (Math.random() - 0.5) * 20, t: 0, dur: s.type === 'three' ? 1.6 : 1.1 + Math.random() * 0.4,
      });
    }

    function updateRockets(dt) {
      for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i];
        r.t += dt;
        const p = Math.min(r.t / r.dur, 1), e = 1 - (1 - p) * (1 - p);
        const x = r.x0 + (r.x1 - r.x0) * e, y = r.y0 + (r.y1 - r.y0) * e;
        spawn(x, y, r.z, (Math.random() - 0.5) * 2, -4 - Math.random() * 4, 0, color(40, 1, 0.6), 0.6, 1, 3);
        spawn(x, y, r.z, 0, 0, 0, color(45, 0.4, 0.9), 0.08, 0, 0);
        if (p >= 1) { bursts[r.type](x, y, r.z, r.hue); rockets.splice(i, 1); }
      }
    }

    // ---------- loop ----------
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
      camera.position.x = Math.sin(t * 0.08) * 10;
      camera.position.y = Math.sin(t * 0.05) * 4;
      camera.lookAt(0, 5, 0);
      updateRockets(dt);
      update(dt);
      composer.render();
    });

    // ---------- WireMock drives everything below ----------
    const banner = document.getElementById('banner');

    // Every page load is a fresh take: rewind the scenario, then listen, then tick.
    await fetch('/__admin/scenarios/anniversary/state', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: '{"state":"Started"}' });

    const events = new EventSource('/anniversary/events');
    events.addEventListener('fireworks', e => {
      for (const s of JSON.parse(e.data)) setTimeout(() => launch(s), s.delay || 0);
    });
    events.addEventListener('banner', e => {
      banner.querySelector('h1').textContent = JSON.parse(e.data).title;
      banner.classList.add('show');
    });

    let ticking;
    events.onopen = () => {
      ticking ??= setInterval(() => fetch('/anniversary/tick'), 2000);
      fetch('/anniversary/tick');
    };
  </script>
</body>
</html>
